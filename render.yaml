services:
  - type: web
    name: dante-scanner
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: scan-data
      mountPath: /var/data
      sizeGB: 1
